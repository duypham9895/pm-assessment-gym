name: Daily PM Question Discovery

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      importApproved:
        description: "Import already approved verified Markdown questions"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run enrich:crawl
      - run: npm run enrich:verify:auto
      - run: npm run validate:questions
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(enrichment): stage daily PM assessment candidates"
          committer: GitHub <noreply@github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: enrichment/daily-discovery
          title: "Daily PM Assessment Candidate Discovery"
          body: |
            ### Daily PM Assessment Candidate Discovery

            This automated Pull Request was generated by the daily discovery workflow. It stages public-source notes and Markdown candidates for manual review, but it does not import crawled questions into `src/questions.ts`.

            **Verification Summary:**
            - [x] Discovery/crawl completed
            - [x] Auto verification report completed
            - [x] Existing question bank validation (`npm run validate:questions`) passed

            Please review Markdown artifacts under `docs/enrichment/` and approve/import locally or by manually dispatching the guarded import job.
          labels: |
            enrichment
            automated-pr

  import-approved:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.importApproved == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run enrich:import
      - run: npm run build
