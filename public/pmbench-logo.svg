<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120" role="img" aria-labelledby="title desc">
  <title id="title">PM Bench slash stamp logo</title>
  <desc id="desc">A compact stamp reading PM slash above Bench with a teal rule.</desc>
  <rect x="2" y="2" width="176" height="116" rx="12" fill="#ffffff" stroke="#0b1724" stroke-width="4"/>
  <text x="22" y="51" fill="#0b1724" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" letter-spacing="0">PM /</text>
  <line x1="22" y1="70" x2="150" y2="70" stroke="#0f6b6e" stroke-width="7" stroke-linecap="round"/>
  <text x="22" y="96" fill="#536273" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="820" letter-spacing="2">BENCH</text>
</svg>
